  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const sanitizeVariables = (url, width, height) => {
        try {
          const sanitizedUrl = new URL(url);
          const u = sanitizedUrl.toString();
          const w = parseInt(width);
          const h = parseInt(height);
          return { url: u, width: w, height: h };
        } catch (e) {
          console.error('Error sanitizing variables', e);
          return { url: '', width: 0, height: 0 };
        }
      };

      const handlePictureInPictureRequest = async event => {
        if (event.data.type !== 'jf-request-pip-window') return;
        const { _url, _width, _height } = event.data;
        const { url, width, height } = sanitizeVariables(_url, _width, _height);
        if (url === '' || width === 0 || height === 0) return;
        if ('documentPictureInPicture' in window) {
          if (window.documentPictureInPicture.window) return;
          const pipWindow = await window.documentPictureInPicture.requestWindow({
            width, height, disallowReturnToOpener: true
          });
          [...document.styleSheets].forEach(styleSheet => {
            try {
              const cssRules = [...styleSheet.cssRules].map(rule => rule.cssText).join('');
              const style = document.createElement('style');
              style.textContent = cssRules;
              pipWindow.document.head.appendChild(style);
            } catch (e) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.type = styleSheet.type;
              link.media = styleSheet.media;
              link.href = styleSheet.href;
              pipWindow.document.head.appendChild(link);
            }
          });
          pipWindow.document.body.innerHTML = `<iframe src="${url}" style="width: ${width}px; height: ${height}px;" allow="microphone *; display-capture *;"></iframe>`;
          return { success: true, isActive: false };
        }
      };

      window.addEventListener('message', handlePictureInPictureRequest);

      (async () => {
        const src = "https://www.noupe.com/s/umd/185b3de5a83/for-embedded-agent.js";
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = function() {
          window.AgentInitializer.init({
            agentRenderURL: "https://www.noupe.com/agent/019eb0cf0b257122b953074c2fc3008390b6",
            rootId: "JotformAgent-019eb0cf0b257122b953074c2fc3008390b6",
            formID: "019eb0cf0b257122b953074c2fc3008390b6",
            contextID: "019eb239aca8790a8ed002ae0bd9ce2c0bfe",
            initialContext: "",
            queryParams: ["skipWelcome=1","maximizable=1","skipWelcome=1","maximizable=1","isNoupeAgent=1","isNoupeLogo=0","noupeSelectedColor=%23FFA100","B_VARIANT_AUTO_OPEN_NOUPE_CHATBOT_ON_PREVIEW=34462"],
            domain: "https://www.noupe.com",
            isDraggable: false,
            background: "linear-gradient(180deg, #6C73A8 0%, #6C73A8 100%)",
            chatBackgroundColor: "#FFFFFF",
            buttonBackgroundColor: "#0066C3",
            buttonIconColor: "#FFFFFF",
            inputTextColor: "#01105C",
            variant: false,
            customizations: {
              greeting: "Yes",
              greetingMessage: "Hi! How can I assist you?",
              openByDefault: "No",
              pulse: "Yes",
              position: "right",
              autoOpenChatIn: "0",
              layout: "extended"
            },
            isVoice: false,
            isVoiceWebCallEnabled: false
          });
        };
        document.head.appendChild(script);
      })();
    </script>
