kind = "web"
previewPath = "/"
title = "Global Community Cookbook"
version = "1.0.0"
id = "artifacts/cookbook"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22350

[services.development]
run = "pnpm --filter @workspace/cookbook run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cookbook", "run", "build" ]
publicDir = "artifacts/cookbook/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22350"
BASE_PATH = "/"
